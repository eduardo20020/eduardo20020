name: Metrics

on:
  schedule:
    - cron: "0 12 * * *" # 06:00 hora del centro de México
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # METRICS_TOKEN: token clásico con scopes `repo` y `read:user` para incluir repos privados.
      # No se usan plugin_activity ni la sección `repositories` de plugin_lines porque muestran nombres de repos.
      - name: Actividad
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics/metrics.activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: America/Mexico_City
          base: header, activity, community, repositories, metadata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_lines: yes
          plugin_lines_sections: base, history
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B

      - name: Hábitos y lenguajes
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics/metrics.habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: America/Mexico_City
          base: ""
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          plugin_habits_days: 30
          plugin_habits_from: 300
          plugin_languages: yes
          plugin_languages_ignored: css, scss, less
          plugin_languages_details: percentage
          plugin_languages_limit: 8
